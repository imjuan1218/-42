<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전 세계 195개국 완벽 환생 테스트</title>
  <style>
    :root {
      --bg-color: #fffbeb;
      --card-bg: #ffffff;
      --primary-color: #f59e0b;
      --primary-hover: #d97706;
      --text-color: #451a03;
      --sub-text: #78350f;
      --accent-bg: #fef3c7;
    }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .container {
      background-color: var(--card-bg);
      max-width: 680px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px rgba(180, 83, 9, 0.12);
      text-align: center;
      border: 3px solid #fde68a;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 10px;
      color: var(--text-color);
    }

    p.subtitle {
      font-size: 1.2rem;
      color: var(--sub-text);
      margin-bottom: 30px;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 16px 36px;
      font-size: 1.4rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
    }

    .result-box {
      display: none;
      margin-top: 30px;
      animation: fadeIn 0.5s ease-in-out;
    }

    .flag {
      font-size: 6rem;
      line-height: 1;
      margin: 15px 0;
    }

    .country-name {
      font-size: 2.5rem;
      font-weight: bold;
      color: var(--primary-hover);
      margin-bottom: 10px;
    }

    .description {
      font-size: 1.2rem;
      line-height: 1.6;
      background-color: var(--accent-bg);
      padding: 18px;
      border-radius: 16px;
      margin-bottom: 25px;
      color: var(--text-color);
    }

    .story-card {
      text-align: left;
      background-color: #fff8f0;
      border-left: 6px solid var(--primary-color);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 30px;
    }

    .story-title {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--sub-text);
    }

    .story-content {
      font-size: 1.15rem;
      line-height: 1.7;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

    // 인구 비례 확률 추첨 함수
    function getRandomCountry() {
      const totalWeight = countries.reduce((sum, c) => sum + c.weight, 0);
      let randomNum = Math.random() * totalWeight;

      for (let country of countries) {
        if (randomNum < country.weight) {
          return country;
        }
        randomNum -= country.weight;
      }
      return countries[0];
    }

    // 환생 실행 함수
    function reincarnate() {
      const country = getRandomCountry();
      const story = lifeStories[Math.floor(Math.random() * lifeStories.length)];

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('result-screen').style.display = 'block';

      document.getElementById('flag').textContent = country.flag;
      document.getElementById('country-name').textContent = country.name;
      document.getElementById('description').textContent = country.desc;
      document.getElementById('story-content').textContent = story.text;
    }
  </script>
